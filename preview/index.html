<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSM 样式预览</title>
<style>
body{margin:24px;background:#10141c;color:#e7ecf3;font:16px/1.6 'Microsoft YaHei',sans-serif}h1{font-size:26px}select,input{margin:8px;padding:8px}a{color:#4fcbff}#frame{width:100%;overflow:auto;border:1px solid #465269}#stage{position:relative;width:1920px;height:1080px;background:#202735 center/100% 100% no-repeat;color:white;font-family:'Microsoft YaHei','Segoe UI',sans-serif;text-shadow:0 1px 2px #000,0 0 4px #000} .hintEntry{position:absolute;white-space:pre;line-height:1.08;text-align:center;transform-origin:center center}pre{white-space:pre-wrap}button{padding:8px}
</style>
<h1>HSM 样式预览</h1>
<p>这是排版近似，不是游戏截图或实际客户端验收。画布固定为 1920×1080；可横向滚动查看。</p>
<label>样式<select id="selection"></select></label>
<label>选择本地游戏背景<input id="background" type="file" accept="image/*"></label>
<button id="clear">移除背景</button>
<div id="frame"><div id="stage"></div></div>
<h2>输入与检查结果</h2><pre id="details"></pre>
<p><a href="../docs/hsm-style-guide.md">样式指南</a> · 背景只在当前浏览器读取，不发送到服务器。</p>
<script src="preview-core.js"></script><script src="styles.js"></script>
<script>
const select=document.getElementById('selection'),stage=document.getElementById('stage');
for(const [i,s] of cementStyles.entries()){const option=document.createElement('option');option.value=i;option.textContent=s.name;select.append(option);}
function render(){
 const style=cementStyles[Number(select.value)],model=HintDisplayPreviewCore.buildPreviewModel(style.entries,{width:1920,height:1080});
 stage.replaceChildren();
 for(const entry of model.entries){const el=document.createElement('div');el.className='hintEntry';el.style.cssText=`left:${entry.leftPercent}%;top:${entry.topPercent}%;font-size:${entry.fontSizePx}px;transform:${entry.transform};color:${entry.color||'inherit'}`;el.innerHTML=entry.html;stage.append(el);}
 document.getElementById('details').textContent=JSON.stringify({说明:style.description,输入:style.entries,检查:model.validation},null,2);
}
let backgroundUrl=null;
document.getElementById('background').onchange=event=>{const file=event.target.files[0];if(!file)return;if(backgroundUrl)URL.revokeObjectURL(backgroundUrl);backgroundUrl=URL.createObjectURL(file);stage.style.backgroundImage=`url("${backgroundUrl}")`;};
document.getElementById('clear').onclick=()=>{stage.style.backgroundImage='none';if(backgroundUrl)URL.revokeObjectURL(backgroundUrl);backgroundUrl=null;};
select.onchange=render;render();
</script>
</html>
